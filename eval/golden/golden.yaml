- id: q004
  question: when BrightCart authorizes and captures card payments
  evidence:
  - doc_id: brightcart/v1/payments/card-payments
    text: BrightCart authorizes the card when the order is placed and normally captures the charge when the order ships. The authorization reserves funds but is not the final settled charge. If the order is canceled before capture, BrightCart releases the authorization request.
  answerable: true
