    text: At 7 calendar days, the case is assigned to the customs broker queue; at 14 days, the customer may choose refund or reshipment.
  - doc_id: brightcart/v3/lang/envios-internacionales-es
    text: Los paquetes retenidos en aduana durante 14 días naturales permiten al cliente elegir entre reembolso o reenvío.
  answerable: true
  tags:
  - module-00
  - long-form
  - multi-evidence
  note: Module 0 question. The email and Slack copies of the same sentence are not evidence.
