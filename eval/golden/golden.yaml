# BrightCart golden set.
#
# 360 questions: 314 answerable, 46 unanswerable. Each item has id, question, evidence, answerable, tags and an optional note.
#
# Evidence rule (read this before changing a label):
#   Evidence lists the passages that state the correct current answer in an authoritative document:
#   status active and authority primary or implementation. Evidence names a document and copies the passage
#   word for word from data/<system>/normalized/docs.jsonl. It never names a chunk.
#   Not evidence: archived and retired copies (unless the question asks about a past period), the generated
#   noise copies (release notes, incidents, draft FAQs, support cases, wiki copies, regional notes, Slack threads),
#   secondary notes, and the human email, Slack, ticket and call copies. These can repeat the right sentence
#   or a wrong one. Retrieving them instead of the authoritative page counts as a miss. That is the point of the set.
#   When two authoritative documents disagree, the later effective date wins, and the question is tagged
#   authority-conflict. Conflicts that cannot be settled from the corpus are not asked as a number. See CHANGELOG.md.
#   Restricted and security documents (corpus restricted, fake PII, fake secrets, prompt injection) are not in this set.
#   Module 5 tests them with its own adversarial set.
#
# Wording: questions are written the way an on call engineer types them. They were drafted by a model after
# reading the passage, then checked for copied wording. They have not been reviewed by a person yet.
- id: q001
