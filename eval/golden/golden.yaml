- id: q006
  question: What is BrightCart's current API throttling limit, rate window, and retry interval according to Policy Hub?
  evidence:
  - doc_id: brightcart/v1/api/rate-limits
    text: The default public API limit is 600 requests per minute per client. When the limit is exceeded, the API returns HTTP 429 and includes a Retry After value. Clients should wait for the indicated period and use backoff instead of immediately retrying in a tight loop.
  - doc_id: brightcart/v1/api/rate-limits
    text: 'An integration sends more than 600 requests within the active minute and receives 429 responses with Retry After: 20. The client waits at least 20 seconds and resumes gradually rather than sending the failed requests all at once.'
  answerable: true
  tags:
  - module-00
  - everyday-policy
  - authority-conflict
  - multi-evidence
  note: 'Module 0 question. First written as unanswerable, but the corpus answers it: 600 requests per minute per client, Retry After 20.'
