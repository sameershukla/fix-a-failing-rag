# Semantic cache eval pairs (Lesson 6.3). DRAFT written by Claude, to be reviewed by the author. Written BEFORE the cache code.
# base       a golden question id (its wording is the question that fills the cache)
# paraphrase same intent, different words: the cache SHOULD answer it from the stored answer.
# near_miss  similar words, different intent or a different answer: the cache must NOT answer it from the stored answer.
# A near miss changes one fact that changes the answer (a tier, a number, a region, a product, a rule).
pairs:
  - {base: q015, paraphrase: "if the customer is mailing the item back, does shipping time eat into the 30 day return window", near_miss: "does the 30 day return window start at the order date or at delivery"}
