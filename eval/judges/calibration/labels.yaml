  answer: 'Mid-cycle upgrades divide by a **fixed 30-day denominator**, not the actual length of the calendar month. This keeps results
    the same regardless of month length.


    The calculation is:


    ```

    charge = round_half_up( max(0, new_monthly_price - old_monthly_price) × days_remaining / 30 )

    ```


    For example, upgrading from a $10.00 to a $30.00 monthly plan with 15 days remaining gives $20.00 × 15/30 = **$10.00**.


    The function''s docstring defines this rule. The policy matrix''s remaining-term credit rows cover annual upgrades and don''t change
    the 30-day divisor for monthly upgrades.'
  verdict: faithful
