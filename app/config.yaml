# App config: the end state of the last lesson. Module 3 stack so far: 250 token chunks with title prefix, table and config
# aware chunks (Module 2), hybrid search (BM25 weight 2) over the top 50 of each, a cross encoder reranking the top 20,
# and a filter that keeps only active, authoritative documents.
# Every setting here contributes to the config hash. Experiments live in config/experiments/.

corpus:
  include:
  - corpus
  exclude: []
chunking:
  overlap_tokens: 25
  size_tokens: 250
  strategy: router
  tokenizer: sentence-transformers/all-MiniLM-L6-v2
  unit: tokens
  structure:
    tables: true
    config: true
    code: false
    headings: false
    title_prefix: true
embedding:
  provider: sentence-transformers
  model: sentence-transformers/all-MiniLM-L6-v2
  dimensions: 384
  normalize: true
vector_store:
  provider: chroma
  collection: auto
  distance: cosine
retrieval:
  bm25_weight: 2.0
  candidates: 50
  k: 5
  mode: hybrid
  rerank:
    enabled: true
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    top_n: 20
  rrf_k: 60
  vector_weight: 1.0
  filters:
    status:
    - active
    authority:
    - primary
    - implementation
    - observational
llm:
  provider: anthropic
  model: claude-sonnet-5-5
  max_tokens: 1000
generation:
  prompt: plain   # plain or cited (Lesson 4.4). Prompt texts are in app/generation/answer.py.
