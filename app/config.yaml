# App config: the end state of the last lesson. Module 2 end state: fixed chunks fit to the embedder window,
# with table aware and config aware chunks and the document title in front of every remaining window.
# Every setting here contributes to the config hash. Experiments live in config/experiments/.

corpus:
  include:
  - corpus
  exclude: []
chunking:
  overlap_tokens: 25
  size_tokens: 250
  strategy: router
  tokenizer: sentence-transformers/all-MiniLM-L6-v2
  unit: tokens
  structure:
    tables: true
    config: true
    code: false
    headings: false
    title_prefix: true
embedding:
  provider: sentence-transformers
  model: sentence-transformers/all-MiniLM-L6-v2
  dimensions: 384
  normalize: true
vector_store:
  provider: chroma
  collection: auto
  distance: cosine
retrieval:
  mode: vector
  k: 5
llm:
  provider: anthropic
  model: claude-sonnet-5-5
  max_tokens: 1000
