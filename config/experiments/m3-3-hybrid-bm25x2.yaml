# Experiment m3-3-hybrid-bm25x2. Hybrid with BM25 weighted twice as much.
chunking:
  overlap_tokens: 25
  size_tokens: 250
  strategy: router
  structure:
    code: false
    config: true
    headings: false
    tables: true
    title_prefix: true
  tokenizer: sentence-transformers/all-MiniLM-L6-v2
  unit: tokens
corpus:
  exclude: []
  include:
  - corpus
embedding:
  dimensions: 384
  model: sentence-transformers/all-MiniLM-L6-v2
  normalize: true
  provider: sentence-transformers
llm:
  max_tokens: 1000
  model: claude-sonnet-5-5
  provider: anthropic
retrieval:
  k: 5
  mode: hybrid
  candidates: 50
  rrf_k: 60
  vector_weight: 1.0
  bm25_weight: 2.0
vector_store:
  collection: auto
  distance: cosine
  provider: chroma
