# Experiment m2-5b. Same as m2-4-code250 plus heading aware chunks for documents of 20,000 characters or more.
chunking:
  overlap_tokens: 25
  size_tokens: 250
  strategy: router
  tokenizer: sentence-transformers/all-MiniLM-L6-v2
  unit: tokens
  structure:
    tables: true
    config: true
    code: true
    headings: long
  heading_min_chars: 20000
corpus:
  exclude: []
  include:
  - corpus
embedding:
  dimensions: 384
  model: sentence-transformers/all-MiniLM-L6-v2
  normalize: true
  provider: sentence-transformers
llm:
  max_tokens: 1000
  model: claude-sonnet-5-5
  provider: anthropic
retrieval:
  k: 5
  mode: vector
vector_store:
  collection: auto
  distance: cosine
  provider: chroma
