# Experiment m2-1-window250. Same as app/config.yaml except chunking.
chunking:
  overlap_tokens: 25
  size_tokens: 250
  strategy: fixed
  tokenizer: sentence-transformers/all-MiniLM-L6-v2
  unit: tokens
corpus:
  exclude: []
  include:
  - corpus
embedding:
  dimensions: 384
  model: sentence-transformers/all-MiniLM-L6-v2
  normalize: true
  provider: sentence-transformers
llm:
  max_tokens: 1000
  model: claude-sonnet-5-5
  provider: anthropic
retrieval:
  k: 5
  mode: vector
vector_store:
  collection: auto
  distance: cosine
  provider: chroma
