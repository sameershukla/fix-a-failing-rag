# Experiment m3-7-e5-small. Current stack with the embedding model swapped to intfloat/e5-small-v2 (reads 512 tokens, needs query: and passage: prefixes).
chunking:
  overlap_tokens: 25
  size_tokens: 250
  strategy: router
  structure:
    code: false
    config: true
    headings: false
    tables: true
    title_prefix: true
  tokenizer: intfloat/e5-small-v2
  unit: tokens
  window_tokens: 510
corpus:
  exclude: []
  include:
  - corpus
embedding:
  dimensions: 384
  model: intfloat/e5-small-v2
  normalize: true
  provider: sentence-transformers
  query_prefix: 'query: '
  passage_prefix: 'passage: '
llm:
  max_tokens: 1000
  model: claude-sonnet-5-5
  provider: anthropic
retrieval:
  bm25_weight: 2.0
  candidates: 50
  filters:
    authority:
    - primary
    - implementation
    - observational
    status:
    - active
  k: 5
  mode: hybrid
  rerank:
    enabled: true
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    top_n: 20
  rrf_k: 60
  vector_weight: 1.0
vector_store:
  collection: auto
  distance: cosine
  provider: chroma
