# Experiment m2-6. Same as m2-3-config250 plus the document title in front of every fixed window.
chunking:
  overlap_tokens: 25
  size_tokens: 250
  strategy: router
  tokenizer: sentence-transformers/all-MiniLM-L6-v2
  unit: tokens
  structure:
    tables: true
    config: true
    code: false
    headings: false
    title_prefix: true
corpus:
  exclude: []
  include:
  - corpus
embedding:
  dimensions: 384
  model: sentence-transformers/all-MiniLM-L6-v2
  normalize: true
  provider: sentence-transformers
llm:
  max_tokens: 1000
  model: claude-sonnet-5-5
  provider: anthropic
retrieval:
  k: 5
  mode: vector
vector_store:
  collection: auto
  distance: cosine
  provider: chroma
