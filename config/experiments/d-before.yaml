# Experiment: Lesson 8.4. The BEFORE world: policy edition 2026.3 is not published yet and edition 2026.1 is still active. Same corpus, applied as an overlay (app/ingest/overlay.py). Its own Chroma collection.
cache:
  semantic:
    enabled: false
    threshold: 0.96
    ttl_days: 7
chunking:
  overlap_tokens: 25
  size_tokens: 250
  strategy: router
  structure:
    code: false
    config: true
    headings: false
    tables: true
    title_prefix: true
  tokenizer: sentence-transformers/all-MiniLM-L6-v2
  unit: tokens
corpus:
  exclude: []
  include:
  - corpus
  overlay:
  - exclude: true
    match: ^brightcart/v3/policy/[^/]+/[^/]+/2026\.3(-eu)?$
  - match: ^brightcart/v3/policy/[^/]+/[^/]+/2026\.1$
    set:
      retired_date: null
      status: active
embedding:
  dimensions: 384
  model: sentence-transformers/all-MiniLM-L6-v2
  normalize: true
  provider: sentence-transformers
generation:
  prompt: plain
llm:
  max_tokens: 1000
  model: claude-sonnet-5-5
  provider: anthropic
retrieval:
  bm25_weight: 2.0
  candidates: 50
  filters:
    authority:
    - primary
    - implementation
    - observational
    status:
    - active
  k: 5
  mode: hybrid
  rerank:
    enabled: true
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    top_n: 20
  rrf_k: 60
  vector_weight: 1.0
security:
  acl: true
  caller: staff-all
  injection_filter: true
  redact: true
tracing:
  enabled: true
  store_prompt: true
vector_store:
  collection: app_drift_before
  distance: cosine
  provider: chroma
